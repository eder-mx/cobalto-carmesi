<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <radialGradient id="cobaltGlow" cx="65%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#1E4ED8" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#14328C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonRim" cx="25%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#9E1B32" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222A3A" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3B6EF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#11151E" stop-opacity="0.9"/>
