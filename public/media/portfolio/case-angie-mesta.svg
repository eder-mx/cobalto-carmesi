  <circle cx="400" cy="430" r="135" stroke="#3B6EF6" stroke-width="1.2" stroke-opacity="0.55" fill="#14328C" fill-opacity="0.15"/>
  <path d="M275 730 C275 610 525 610 525 730" stroke="#F4F5F8" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
