  <line x1="0" y1="180" x2="800" y2="180" stroke="#222A3A" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="0" y1="820" x2="800" y2="820" stroke="#222A3A" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Editorial Portrait Frame Study -->
