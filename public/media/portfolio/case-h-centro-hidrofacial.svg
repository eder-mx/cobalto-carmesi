<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <radialGradient id="clinicalLight" cx="55%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3B6EF6" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#1E4ED8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F5F8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3B6EF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#222A3A" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#090B10"/>
  <rect width="1280" height="720" fill="url(#clinicalLight)"/>
  <!-- Architectural Lines -->
  <line x1="160" y1="0" x2="160" y2="720" stroke="#222A3A" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="1120" y1="0" x2="1120" y2="720" stroke="#222A3A" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="0" y1="120" x2="1280" y2="120" stroke="#222A3A" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="0" y1="600" x2="1280" y2="600" stroke="#222A3A" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Architectural Space & Optical Frame -->
  <rect x="240" y="150" width="800" height="420" stroke="url(#lensRing)" stroke-width="1.5" fill="#11151E" fill-opacity="0.5"/>
  <circle cx="640" cy="360" r="150" stroke="#3B6EF6" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="640" cy="360" r="95" stroke="#F4F5F8" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="280" y1="190" x2="350" y2="190" stroke="#3B6EF6" stroke-width="2"/>
</svg>
